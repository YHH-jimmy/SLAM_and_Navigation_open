kitti2bag_params:
  # KITTI Dataset Type: "raw_synced", "odom_color", or "odom_gray"
  kitti_type: "raw_synced"
  
  # Base directory of KITTI dataset
  dataset_dir: "/path/to/kitti/dataset"
  
  # For RAW dataset only
  date: "2011_09_26"        # Date of the raw dataset (e.g., 2011_09_26)
  drive: "0001"             # Drive number (e.g., 0001, 0002, etc.)
  
  # For ODOMETRY dataset only
  sequence: "00"            # Sequence number (00-21)
  
  # Output bag directory (optional, default: auto-generated name)
  output_bag: ""
  
  # Example configurations:
  # 
  # For RAW dataset:
  #   kitti_type: "raw_synced"
  #   dataset_dir: "/home/user/kitti/raw"
  #   date: "2011_09_26"
  #   drive: "0001"
  #
  # For ODOMETRY grayscale:
  #   kitti_type: "odom_gray"
  #   dataset_dir: "/home/user/kitti/odometry"
  #   sequence: "00"
  #
  # For ODOMETRY color:
  #   kitti_type: "odom_color"
  #   dataset_dir: "/home/user/kitti/odometry"
  #   sequence: "00"
